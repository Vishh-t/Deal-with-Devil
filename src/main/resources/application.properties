spring.application.name=deal_with_devil_CSA

# Database (PostgreSQL via Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/deal_devil}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
# Dev default is update. On the event server set DDL_AUTO=validate so the app never changes the schema by itself
# (create the tables once with DDL_AUTO=update first, then switch to validate).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Game numbers, whole coins. PLACEHOLDERS: replace with the real values once decided.
# Base price = reserve price for a problem; solve reward = preset credit for solving.
game.base-price.bronze=50
game.base-price.silver=100
game.base-price.gold=200
game.solve-reward.bronze=100
game.solve-reward.silver=200
game.solve-reward.gold=400
game.hint-price=30
# How many problems every participant must end each round with (Phase 9). Never hardcode 3 in code.
game.wins-per-round=3
# Redemption must cost more than the deal pays, or the app will not start.
game.devil.deal-payout=100
game.devil.redemption-cost=150

# Set JWT_SECRET in every environment; startup requires at least 32 characters.
# The other defaults below are DEV-ONLY placeholders; set the environment variables for anything real.
app.auth.google-client-id=${GOOGLE_CLIENT_ID:placeholder-google-client-id.apps.googleusercontent.com}
app.auth.jwt-secret=${JWT_SECRET}
app.auth.jwt-expiry-hours=3
# Comma separated. Placeholder emails until the real organisers are known.
app.auth.admin-emails=${ADMIN_EMAILS:admin1@example.com,admin2@example.com}
# Backup admin sign-in (used only if Google sign-in is down). Blank = switched off. Set a long random value to enable it.
app.auth.fallback-admin-passcode=${ADMIN_FALLBACK_PASSCODE:}

# CORS: the React dev server origins (Vite and Create React App defaults)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
